<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="SkyCast is a responsive weather web app that shows real-time weather conditions by city.">
    <title>SkyCast | Weather Web App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app-shell">
        <section class="card" aria-live="polite">
            <header class="app-header">
                <p class="eyebrow">Live Forecast</p>
                <h1>SkyCast</h1>
                <p class="subtitle">Search any city and get instant weather updates.</p>
            </header>

            <form class="search" id="weather-form">
                <label for="city-input" class="sr-only">City name</label>
                <input id="city-input" type="text" placeholder="Enter city name" autocomplete="off" spellcheck="false"
                    required>
                <button type="submit" aria-label="Search city weather">
                    <img src="images/search.png" alt="Search icon">
                </button>
            </form>

            <div class="actions">
                <button id="detect-location" class="ghost-btn" type="button">Use My Location</button>
                <button id="unit-toggle" class="ghost-btn" type="button" aria-pressed="false">Show in
                    Fahrenheit</button>
            </div>

            <p class="status" id="status-text">Type a city and press Enter.</p>

            <section class="weather hidden" id="weather-panel">
                <img src="images/rain.png" class="weather-icon" id="weather-icon" alt="Weather condition icon">
                <h2 class="temp" id="temperature"></h2>
                <h3 class="city" id="city-name"></h3>
                <p class="description" id="weather-description"></p>
                <p class="meta-row" id="last-updated"></p>

                <div class="details">
                    <article class="col">
                        <img src="images/humidity.png" alt="Humidity icon">
                        <div>
                            <p class="label">Humidity</p>
                            <p class="value" id="humidity"></p>
                        </div>
                    </article>
                    <article class="col">
                        <img src="images/wind.png" alt="Wind icon">
                        <div>
                            <p class="label">Wind</p>
                            <p class="value" id="wind"></p>
                        </div>
                    </article>
                    <article class="col metrics-wide">
                        <div>
                            <p class="label">Feels Like</p>
                            <p class="value" id="feels-like"></p>
                        </div>
                    </article>
                    <article class="col metrics-wide">
                        <div>
                            <p class="label">Visibility</p>
                            <p class="value" id="visibility"></p>
                        </div>
                    </article>
                    <article class="col metrics-wide">
                        <div>
                            <p class="label">Sunrise</p>
                            <p class="value" id="sunrise"></p>
                        </div>
                    </article>
                    <article class="col metrics-wide">
                        <div>
                            <p class="label">Sunset</p>
                            <p class="value" id="sunset"></p>
                        </div>
                    </article>
                </div>

                <section class="forecast" id="forecast-section">
                    <h4>5-Day Forecast</h4>
                    <div class="forecast-grid" id="forecast-grid"></div>
                </section>
            </section>

            <section class="recent hidden" id="recent-section">
                <h4>Recent Searches</h4>
                <div class="chips" id="recent-chips"></div>
            </section>

            <p class="error hidden" id="error-text"></p>
            <footer class="footer-note">Built for portfolio and resume showcase.</footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
